<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rhobuilder — choose your path</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <a class="brand" href="./"><span class="brand-mark" aria-hidden="true">ρ</span>rhobuilder</a>
    <nav class="topnav">
      <span class="progress" id="progress" aria-live="polite"></span>
      <a href="docs/index.html">Manual</a>
    </nav>
  </header>
  <main id="app"></main>
  <footer class="footer">
    Prefer to browse? <a href="docs/index.html">Read the full manual</a>.
  </footer>
</div>

<script src="assets/roles.js"></script>
<script>
const ROLES = window.RHO_ROLES;
const app = document.getElementById("app");
const progress = document.getElementById("progress");
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const remember = id => { try { id ? localStorage.setItem("rho-path", id) : localStorage.removeItem("rho-path"); } catch (e) {} };

function renderChooser() {
  progress.textContent = "Step 1 of 2";
  document.title = "rhobuilder — choose your path";
  app.innerHTML = `
    <section class="view">
      <p class="eyebrow">Choose your path</p>
      <h1 class="display">You are…</h1>
      <p class="lede">Pick the role that fits you best, and we'll show you where to start.</p>
      <div class="roles">
        ${ROLES.map(r => `
          <button class="role" data-role="${r.id}">
            <span class="role-label">I'm</span>
            <span class="role-name">${esc(r.name)}</span>
            <span class="role-desc">${esc(r.desc)}</span>
            <span class="role-go">See my path <span class="arrow">→</span></span>
          </button>`).join("")}
      </div>
    </section>`;
  app.querySelectorAll(".role").forEach(b =>
    b.addEventListener("click", () => { location.hash = b.dataset.role; }));
}

function renderPath(role) {
  remember(role.id);
  progress.textContent = "Step 2 of 2";
  document.title = `rhobuilder — ${role.short}`;
  const others = ROLES.filter(r => r.id !== role.id);
  app.innerHTML = `
    <section class="view">
      <button class="back" id="back"><span aria-hidden="true">←</span> All roles</button>
      <p class="eyebrow">Your path · ${esc(role.short)}</p>
      <h1 class="display">Start here.</h1>
      <p class="lede">${esc(role.intro)}</p>
      <ol class="steps">
        ${role.steps.map((s, i) => `
          <li class="step${i === 0 ? " first" : ""}">
            <span class="num" aria-hidden="true">${i + 1}</span>
            <article class="card">
              <h2>${esc(s.title)}</h2>
              <p>${esc(s.summary)}</p>
              <ul class="points">${s.points.map(p => `<li>${esc(p)}</li>`).join("")}</ul>
              ${s.note ? `<div class="note">${esc(s.note)}</div>` : ""}
              <a class="cta" href="docs/${s.page}.html?path=${role.id}">
                ${i === 0 ? "Start with" : "Open"} ${esc(s.title)} <span class="arrow">→</span>
              </a>
            </article>
          </li>`).join("")}
      </ol>
      <p class="switch">Not you? Switch to
        ${others.map((r, i) => `<button data-role="${r.id}">${esc(r.short.toLowerCase())}</button>${i < others.length - 1 ? "," : ""}`).join(" ")}
      </p>
    </section>`;
  document.getElementById("back").addEventListener("click", () => { location.hash = ""; });
  app.querySelectorAll(".switch button").forEach(b =>
    b.addEventListener("click", () => { location.hash = b.dataset.role; }));
}

function route() {
  const role = ROLES.find(r => r.id === location.hash.slice(1));
  role ? renderPath(role) : renderChooser();
  window.scrollTo(0, 0);
}

window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
